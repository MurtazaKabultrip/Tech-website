name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Novaforge.slnx

      - name: Build
        run: dotnet build Novaforge.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Novaforge.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Check for vulnerable packages
        run: dotnet list Novaforge.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt && ! grep -q "has the following vulnerable packages" vuln.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t novaforge-web:${{ github.sha }} .
